name: AquaWatch checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev,analytics]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: aquawatch demo
      - run: aquawatch analytics
      - run: python scripts/check_analytics.py
      - run: python scripts/build_powerbi.py
      - run: python scripts/check_repository.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            docs/images/
            dbt/target/run_results.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aquawatch
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: aquawatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aquawatch -d aquawatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aquawatch:ephemeral-ci-password@127.0.0.1:5432/aquawatch_test
      DATABASE_URL: postgresql+psycopg://aquawatch:ephemeral-ci-password@127.0.0.1:5432/aquawatch_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: aquawatch
      PGPASSWORD: ephemeral-ci-password
      PGDATABASE: aquawatch_test
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e ".[dev,analytics]"
      - run: pytest -q
      - run: aquawatch demo
      - run: aquawatch analytics --target postgres
      - run: python scripts/check_analytics.py --target postgres
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_containers.py
      - name: Build the image for security verification
        run: docker build --pull --tag aquawatch-security:ci .
      - name: Record installed security-sensitive package versions
        run: docker run --rm aquawatch-security:ci dpkg-query -W perl-base libpcre2-8-0 libsqlite3-0 gzip
      - name: Scan the final image, including unfixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aquawatch-security:ci
          scanners: vuln
          format: json
          output: container-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
      - name: Reject fixable high or critical image vulnerabilities
        run: trivy image --skip-db-update --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 aquawatch-security:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-report
          path: container-vulnerabilities.json
