[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquawatch"
version = "1.0.0"
description = "Explainable water-consumption and billing investigations, using synthetic data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
analytics = ["dbt-duckdb>=1.9,<2", "dbt-postgres>=1.9,<2"]

[project.scripts]
aquawatch = "aquawatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aquawatch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
